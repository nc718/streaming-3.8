services:
  - type: web
    name: kav-ai-streaming
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
      - key: STREAM_SECRET
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: "gemini-3.8-live"
      - key: GEMINI_VOICE
        value: "Kore"
